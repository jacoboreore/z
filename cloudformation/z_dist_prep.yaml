#AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Valley Scanner v1 foundation stack.
  Creates:
  - SQS work queue
  - SQS dead-letter queue
  - DynamoDB job tracking table
  - DynamoDB chunk tracking table
  - CloudWatch Log Group
  - Optional queue policy stub

Parameters:
  ProjectName:
    Type: String
    Default: valley-scanner
    Description: Base name used for resources

  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    Description: Environment suffix, for example dev, test, prod

  QueueVisibilityTimeout:
    Type: Number
    Default: 900
    Description: >
      Visibility timeout in seconds for the main work queue.
      Set this longer than the expected worker processing time per chunk.

  QueueMessageRetentionSeconds:
    Type: Number
    Default: 345600
    Description: Message retention period in seconds (default 4 days)

  DLQMessageRetentionSeconds:
    Type: Number
    Default: 1209600
    Description: Dead-letter queue retention period in seconds (default 14 days)

  MaxReceiveCount:
    Type: Number
    Default: 3
    Description: Number of receives before moving a message to the DLQ

  JobTableBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: DynamoDB billing mode for both jobs and chunks tables

  JobTableReadCapacityUnits:
    Type: Number
    Default: 5
    Description: Used only if PROVISIONED is selected

  JobTableWriteCapacityUnits:
    Type: Number
    Default: 5
    Description: Used only if PROVISIONED is selected

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: Retention in days for the CloudWatch log group

Conditions:
  UseProvisionedBilling: !Equals [!Ref JobTableBillingMode, PROVISIONED]

Resources:
  ValleyScannerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-dlq'
      MessageRetentionPeriod: !Ref DLQMessageRetentionSeconds
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Role
          Value: dead-letter-queue

  ValleyScannerWorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-work'
      VisibilityTimeout: !Ref QueueVisibilityTimeout
      MessageRetentionPeriod: !Ref QueueMessageRetentionSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ValleyScannerDLQ.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Role
          Value: work-queue

  ValleyScannerWorkQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ValleyScannerWorkQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ChangeMessageVisibility
            Resource: !GetAtt ValleyScannerWorkQueue.Arn

  ValleyScannerJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-jobs'
      BillingMode: !Ref JobTableBillingMode
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      ProvisionedThroughput: !If
        - UseProvisionedBilling
        - ReadCapacityUnits: !Ref JobTableReadCapacityUnits
          WriteCapacityUnits: !Ref JobTableWriteCapacityUnits
        - !Ref AWS::NoValue
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Role
          Value: job-tracking

  ValleyScannerChunksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-chunks'
      BillingMode: !Ref JobTableBillingMode
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: chunk_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
        - AttributeName: chunk_id
          KeyType: RANGE
      ProvisionedThroughput: !If
        - UseProvisionedBilling
        - ReadCapacityUnits: !Ref JobTableReadCapacityUnits
          WriteCapacityUnits: !Ref JobTableWriteCapacityUnits
        - !Ref AWS::NoValue
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Role
          Value: chunk-tracking

  ValleyScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/${ProjectName}/${EnvironmentName}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  WorkQueueName:
    Description: Name of the main SQS work queue
    Value: !GetAtt ValleyScannerWorkQueue.QueueName

  WorkQueueUrl:
    Description: URL of the main SQS work queue
    Value: !Ref ValleyScannerWorkQueue

  WorkQueueArn:
    Description: ARN of the main SQS work queue
    Value: !GetAtt ValleyScannerWorkQueue.Arn

  DLQName:
    Description: Name of the dead-letter queue
    Value: !GetAtt ValleyScannerDLQ.QueueName

  DLQUrl:
    Description: URL of the dead-letter queue
    Value: !Ref ValleyScannerDLQ

  DLQArn:
    Description: ARN of the dead-letter queue
    Value: !GetAtt ValleyScannerDLQ.Arn

  JobsTableName:
    Description: DynamoDB table name for job tracking
    Value: !Ref ValleyScannerJobsTable

  JobsTableArn:
    Description: DynamoDB table ARN for job tracking
    Value: !GetAtt ValleyScannerJobsTable.Arn

  ChunksTableName:
    Description: DynamoDB table name for chunk tracking
    Value: !Ref ValleyScannerChunksTable

  ChunksTableArn:
    Description: DynamoDB table ARN for chunk tracking
    Value: !GetAtt ValleyScannerChunksTable.Arn

  LogGroupName:
    Description: CloudWatch log group name
    Value: !Ref ValleyScannerLogGroup