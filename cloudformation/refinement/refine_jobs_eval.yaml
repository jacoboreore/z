AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Valley Scanner - Distributed Refiner - DynamoDB resources only.
  Creates the jobs table and evals table for the Z distributed refiner.

Parameters:
  ProjectName:
    Type: String
    Default: valley-scanner-refine
    Description: Prefix used for naming and tagging resources.

  RefineJobsTableName:
    Type: String
    Default: vs-refine-jobs
    Description: DynamoDB table name for refinement jobs.

  RefineEvalsTableName:
    Type: String
    Default: vs-refine-evals
    Description: DynamoDB table name for refinement eval requests/results.

Resources:
  RefineJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref RefineJobsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: refine_id
          AttributeType: S
      KeySchema:
        - AttributeName: refine_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: refine-jobs
        - Key: StackRole
          Value: dynamodb

  RefineEvalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref RefineEvalsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: refine_id
          AttributeType: S
        - AttributeName: eval_id
          AttributeType: S
      KeySchema:
        - AttributeName: refine_id
          KeyType: HASH
        - AttributeName: eval_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: refine-evals
        - Key: StackRole
          Value: dynamodb

Outputs:
  RefineJobsTableName:
    Description: Name of the refinement jobs table
    Value: !Ref RefineJobsTable

  RefineJobsTableArn:
    Description: ARN of the refinement jobs table
    Value: !GetAtt RefineJobsTable.Arn

  RefineEvalsTableName:
    Description: Name of the refinement evals table
    Value: !Ref RefineEvalsTable

  RefineEvalsTableArn:
    Description: ARN of the refinement evals table
    Value: !GetAtt RefineEvalsTable.Arn