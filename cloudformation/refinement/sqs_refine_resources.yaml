AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Valley Scanner - Distributed Refiner - SQS resources only.
  Creates the single refinement queue used for distributed Z(t) evaluations.

Parameters:
  ProjectName:
    Type: String
    Default: valley-scanner-refine
    Description: Prefix used for naming and tagging resources.

  RefineEvalQueueName:
    Type: String
    Default: vs-refine-eval-queue
    Description: Main SQS queue for refinement Z(t) evaluation requests.

  RefineEvalDLQName:
    Type: String
    Default: vs-refine-eval-dlq
    Description: Dead-letter queue for refinement Z(t) evaluation failures.

  VisibilityTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 30
    MaxValue: 43200
    Description: >
      Visibility timeout for the main queue. Must be longer than the expected
      worker processing time for one eval message.

  MessageRetentionSeconds:
    Type: Number
    Default: 1209600
    MinValue: 60
    MaxValue: 1209600
    Description: Message retention period in seconds (default 14 days).

  ReceiveMessageWaitTimeSeconds:
    Type: Number
    Default: 20
    MinValue: 0
    MaxValue: 20
    Description: Long polling wait time in seconds.

  MaxReceiveCount:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 1000
    Description: Number of receives before moving a message to the DLQ.

Resources:
  RefineEvalDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref RefineEvalDLQName
      MessageRetentionPeriod: !Ref MessageRetentionSeconds
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: refine-eval-dlq
        - Key: StackRole
          Value: sqs

  RefineEvalQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref RefineEvalQueueName
      VisibilityTimeout: !Ref VisibilityTimeoutSeconds
      MessageRetentionPeriod: !Ref MessageRetentionSeconds
      ReceiveMessageWaitTimeSeconds: !Ref ReceiveMessageWaitTimeSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RefineEvalDLQ.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: refine-eval-queue
        - Key: StackRole
          Value: sqs

Outputs:
  RefineEvalQueueName:
    Description: Name of the refinement evaluation queue
    Value: !GetAtt RefineEvalQueue.QueueName

  RefineEvalQueueUrl:
    Description: URL of the refinement evaluation queue
    Value: !Ref RefineEvalQueue

  RefineEvalQueueArn:
    Description: ARN of the refinement evaluation queue
    Value: !GetAtt RefineEvalQueue.Arn

  RefineEvalDLQName:
    Description: Name of the refinement evaluation dead-letter queue
    Value: !GetAtt RefineEvalDLQ.QueueName

  RefineEvalDLQUrl:
    Description: URL of the refinement evaluation dead-letter queue
    Value: !Ref RefineEvalDLQ

  RefineEvalDLQArn:
    Description: ARN of the refinement evaluation dead-letter queue
    Value: !GetAtt RefineEvalDLQ.Arn