AWSTemplateFormatVersion: '2010-09-09'
Description: EventBridge rule for existing S3 bucket jacob-z -> Lambda on jobs/*/pre_calc.txt

Parameters:
  ExistingBucketName:
    Type: String
    Default: jacob-z

  JobProcessorLambdaArn:
    Type: String
    Description: ARN of the existing Lambda that reads pre_calc.txt and writes Dynamo rows

Resources:
  EventBridgeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobProcessorLambdaArn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PrecalcCreatedRule.Arn

  PrecalcCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: jacob-z-precalc-created-rule
      Description: Trigger Lambda when pre_calc.txt is created under jobs/ in existing bucket
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref ExistingBucketName
          object:
            key:
              - prefix: jobs/
              - suffix: pre_calc.txt
      Targets:
        - Id: JobProcessorLambdaTarget
          Arn: !Ref JobProcessorLambdaArn

Outputs:
  RuleArn:
    Description: ARN of the EventBridge rule
    Value: !GetAtt PrecalcCreatedRule.Arn

  BucketName:
    Description: Existing S3 bucket monitored by this rule
    Value: !Ref ExistingBucketName

  LambdaTargetArn:
    Description: Lambda target ARN
    Value: !Ref JobProcessorLambdaArn