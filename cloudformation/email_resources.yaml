AWSTemplateFormatVersion: "2010-09-09"
Description: z_mail notification Lambda for Valley Scanner trigger alerts

Parameters:
  AlertEmail:
    Type: String
    Description: Email that will receive VS calculation trigger alerts

  InvokerLambdaRoleArn:
    Type: String
    Description: IAM Role ARN of the Lambda that will invoke z_mail

Resources:
  ZMailTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: z-mail-alert-topic-jacob

  ZMailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref ZMailTopic

  ZMailLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: z_mail_role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ZMailLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ZMailTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  ZMailLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: z_mail
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt ZMailLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          ALERT_TOPIC_ARN: !Ref ZMailTopic
      Code:
        ZipFile: |
          import os
          import json
          import boto3
          from datetime import datetime, timezone

          sns = boto3.client("sns")
          TOPIC_ARN = os.environ["ALERT_TOPIC_ARN"]

          def lambda_handler(event, context):
              message = {
                  "alert": "Valley Scanner calculation triggered",
                  "time_utc": datetime.now(timezone.utc).isoformat(),
                  "event": event
              }

              sns.publish(
                  TopicArn=TOPIC_ARN,
                  Subject="VS calculation triggered",
                  Message=json.dumps(message, indent=2, default=str)
              )

              return {
                  "ok": True,
                  "message": "Email notification sent"
              }

  InvokeZMailPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: Invoke_z_mail_policy
      Roles:
        - !Select [1, !Split ["/", !Ref InvokerLambdaRoleArn]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !GetAtt ZMailLambda.Arn

Outputs:
  ZMailLambdaName:
    Value: !Ref ZMailLambda

  ZMailLambdaArn:
    Value: !GetAtt ZMailLambda.Arn

  ZMailTopicArn:
    Value: !Ref ZMailTopic