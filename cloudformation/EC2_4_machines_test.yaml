AWSTemplateFormatVersion: '2010-09-09'
Description: Valley Scanner fixed fleet - 4 EC2 worker boxes

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI ID for the prebuilt Valley Scanner worker image

  InstanceType:
    Type: String
    Default: c7i.xlarge
    Description: EC2 instance type for all 4 workers (for example c6i.xlarge, c7i.xlarge)

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet where the worker instances will be launched

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group to attach to the worker instances

  IamInstanceProfileName:
    Type: String
    Description: Existing IAM instance profile name for the workers

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: "jacob-key-pair-all-EC2"
    Description: Optional EC2 key pair for SSH access
    ConstraintDescription: Must be an existing EC2 KeyPair name or empty

  RootVolumeSize:
    Type: Number
    Default: 50
    MinValue: 20
    Description: Root EBS volume size in GiB

  NamePrefix:
    Type: String
    Default: valley-worker
    Description: Prefix used in EC2 Name tags

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  Worker1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref IamInstanceProfileName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-01"
        - Key: Project
          Value: valley-scanner
        - Key: Role
          Value: worker

  Worker2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref IamInstanceProfileName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-02"
        - Key: Project
          Value: valley-scanner
        - Key: Role
          Value: worker

  Worker3:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref IamInstanceProfileName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-03"
        - Key: Project
          Value: valley-scanner
        - Key: Role
          Value: worker

  Worker4:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref IamInstanceProfileName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-04"
        - Key: Project
          Value: valley-scanner
        - Key: Role
          Value: worker

Outputs:
  Worker1Id:
    Value: !Ref Worker1
  Worker2Id:
    Value: !Ref Worker2
  Worker3Id:
    Value: !Ref Worker3
  Worker4Id:
    Value: !Ref Worker4

  Worker1PrivateIp:
    Value: !GetAtt Worker1.PrivateIp
  Worker2PrivateIp:
    Value: !GetAtt Worker2.PrivateIp
  Worker3PrivateIp:
    Value: !GetAtt Worker3.PrivateIp
  Worker4PrivateIp:
    Value: !GetAtt Worker4.PrivateIp
