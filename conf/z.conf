# z.conf — runtime 

mpfr_prec = 300 # MPFR precision (bits)

# theta calculations
theta_stirling_terms = 12 # Σ terms in Stirling‑θ expansion

# prefilter
prefilter_alpha = 0.98 # prefilter strength (0..1)
prefilter_tau = 0.05
prefilter_tau_boost = 0.10 # prefilter slope/threshold

# Newton refinement
newton_tol_abs = 1e-10 # |Z| target
newton_tol_step = 1e-12 # |Δt| target
newton_max_iter = 3 # few NR its (fallback to Brent later)

# threading calculations
use_threaded_z = true # enable parallel Z for large t
use_threaded_newton = false # enable parallel newton for refinement, it forces to use single thread z if true

ball_mid_threshold = 1e-8 # quick reject |mid| > thresh*rad

h_min = 1e-9 # minimum FD step
h_frac_spacing = 0.10 # h ≤ h_frac_spacing * spacing
step_frac_spacing = 0.70 # |Δt| ≤ step_frac_spacing * spacing

min_threads = 1 # ≥1
max_threads = 0 # 0 → use hw_concurrency
rs_min_N_for_threads = 64 # don’t thread tiny N

rs_half_weight_last = true # disable ½‑weight on last term (current policy)
rs_tail_C = 0.5 # tail bound constant (tunable)
theta_exact_switch_t = 1e9 # (reserved) exact/series gate if re‑enabled

# log management
rs_main_log = true
rs_log_debug = false
rs_log_digits = 30

# Valley scanner
valley_grow = 1e-1 # micro factor to add for good t
valley_aggressive_factor = 1000 # factor to walk faster    double tolerance_to_step = 1;
valley_tolerance_to_step = 0.5
valley_max_step = 1e10
valley_max_Zs_relation = 2

# Odlyzko–Schönhage calculations
enable_min_t = 1e8          # only use OS when t0 >= this
samples_per_spacing = 8     # Δt = spacing / S
K_points = 1024             # points computed per block (≤ M)
delta_log_max = 1e-3        # bin width in log n (smaller → more accurate)
poly_deg_R = 4              # Taylor degree (2..6 reasonable)
return_main_sum = false     # if true: skip θ factor (debug)

tol_refine = 1e-4       # what you pass to Newton as “near enough”
z_far = 0.5             # |Zc| above this looks far (order-1)
ratio_far = 0.5         # |dt_pred|/spacing above this looks off-center
min_mult = 10.0         # accept if min|Z| <= min_mult * tol_refine
eps_abs = 1e-3          # absolute guard band for ‘trusted sign’
eps_rel = 0.02          # relative guard band (fraction of median |Z|)
flip_center_frac = 0.6  # flip must be within ±0.6*spacing of center to auto-accept